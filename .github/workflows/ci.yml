name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Accuracy eval, replayed from recorded model responses (no key, no network)
        run: |
          uv run python -m cross_border_fbar.synth --out out/synth --png
          uv run python -m cross_border_fbar.eval --set out/synth --mode replay

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # The environment is already installed by `uv sync --locked`; calling its Python
      # directly runs no install or build step here.
      - name: Generate the synthetic statements
        run: .venv/bin/python -m cross_border_fbar.synth --out out/synth --png
      - name: Accuracy eval, replayed from recorded model responses (no key, no network)
        run: .venv/bin/python -m cross_border_fbar.eval --set out/synth --mode replay
      - name: Reconciliation eval on the replayed readings
        run: .venv/bin/python -m cross_border_fbar.eval.reconcile_eval --set out/synth
      - name: Open-weights extraction eval (Muse Glimmer), replayed
        run: .venv/bin/python -m cross_border_fbar.eval --set out/synth --model muse-glimmer --mode replay
      - name: Open-weights reconciliation eval (Muse Glimmer)
        run: .venv/bin/python -m cross_border_fbar.eval.reconcile_eval --set out/synth --model muse-glimmer

  # Judges may run this on Windows, where fcntl is missing and text defaults to another encoding.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - name: Portability and app tests
        run: uv run pytest -q tests/test_portability.py tests/test_llm.py tests/test_app.py tests/test_value_corrections.py tests/test_client_summary.py tests/test_korean_catalog.py
      - name: "README path: generate, reconcile from recorded readings, open the app"
        shell: pwsh
        run: |
          uv run python -m cross_border_fbar.synth --out out/synth --png
          uv run python -m cross_border_fbar.eval.reconcile_eval --set out/synth
          $app = Start-Process -PassThru -NoNewWindow uv -ArgumentList 'run','python','-m','cross_border_fbar.app','--set','out/synth','--readings','results/muse-spark-1.3_synth.json'
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try {
              $state = Invoke-RestMethod -Uri http://127.0.0.1:8765/api/state -TimeoutSec 5
              if ($state.worksheet.totals.aggregate_usd -ne 373618) { throw "aggregate $($state.worksheet.totals.aggregate_usd)" }
              $ok = $true; break
            } catch { Write-Host "waiting: $_" }
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }

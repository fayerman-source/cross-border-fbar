[project]
name = "cross-border-fbar"
version = "0.1.0"
description = "Foreign bank statements to an FBAR worksheet where every number links to its source line."
requires-python = ">=3.10"
dependencies = [
    "babel>=2.17",
    "fpdf2>=2.8.9",
    "pypdfium2>=5.14.0",
    "uharfbuzz>=0.56.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cross_border_fbar"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
